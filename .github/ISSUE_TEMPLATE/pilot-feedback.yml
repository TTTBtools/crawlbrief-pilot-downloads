{
  "name": "Free-pilot feedback",
  "description": "Tell us whether you could make a report. Do not upload client files.",
  "title": "[Pilot feedback]: ",
  "body": [
    {
      "type": "markdown",
      "attributes": {
        "value": "Thanks for trying CrawlBrief. This is a **public** GitHub issue form and requires GitHub sign-in. Please do not include client names, client CSVs, private URLs, credentials or confidential screenshots. A short description is enough. This does not require a purchase."
      }
    },
    {
      "type": "dropdown",
      "id": "input-used",
      "attributes": {
        "label": "What did you try?",
        "options": [
          "Please choose - not yet answered",
          "The fictional sample only",
          "My own non-sensitive CSV export",
          "I have not tried it yet"
        ]
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "dropdown",
      "id": "result",
      "attributes": {
        "label": "Could you save a report?",
        "options": [
          "Please choose - not yet answered",
          "Yes - I saved an HTML report or action CSV",
          "No - the CSV would not import",
          "No - the report would not preview or download",
          "I stopped before saving",
          "I have not tried it yet"
        ]
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "feedback",
      "attributes": {
        "label": "What worked or got in the way?",
        "description": "A sentence or two is enough. If there was an error, paste its wording after removing private information. Please do not attach your CSV.",
        "placeholder": "I tried ... and expected ... but ..."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "input",
      "id": "environment",
      "attributes": {
        "label": "Browser and export tool/version (optional)",
        "description": "For example: Chrome, Screaming Frog version ... . No client details."
      },
      "validations": {
        "required": false
      }
    },
    {
      "type": "dropdown",
      "id": "client-work",
      "attributes": {
        "label": "Do you already use crawl results in client reports? (optional)",
        "options": [
          "Yes",
          "No",
          "Prefer not to say"
        ]
      },
      "validations": {
        "required": false
      }
    }
  ]
}
